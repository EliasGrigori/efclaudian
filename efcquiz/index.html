<title>EFCQuiz</title>
<!--
=====================================================================
 EFCQuiz v2.1.0 · módulo de treinamento do sistema EFClaudian
 Arquivo único, funciona offline (fontes, QR e PDF embutidos).

 CONFIGURAÇÃO
   window.EFC_CONFIG.empresa  -> nome da empresa (topo e PDF). Vazio = não mostra nada.
   Também editável na tela: Responsável > Configurações.

 VARIÁVEIS DE COR (todas em :root; nenhuma cor fixa fora delas)
   Base ........ --bg --surface --sunk --line --line-forte --fg --muted
   Destaque .... --accent --accent-fg --accent-soft
   Estados ..... --ok --ok-fg --ok-soft  --bad --bad-fg --bad-soft  --warn --warn-fg --warn-soft
   Respostas ... --ans-a --ans-b --ans-c --ans-d --ans-e --ans-f --ans-fg   (sempre com a letra)
   Equipes ..... --eq-1 ... --eq-6  (cor + símbolo de traço reto)
   Mapa ........ --hm-ok --hm-bad --hm-none --hm-fg --hm-none-fg
   Outros ...... --assin-fundo --assin-tinta --qr-escuro --qr-claro --modal-fundo --sombra
   PDF ......... --pdf-tinta --pdf-cinza --pdf-linha --pdf-faixa --pdf-cab --pdf-acento --pdf-ok --pdf-bad --pdf-none --pdf-branco
                 (o PDF lê sempre a versão clara, pelo elemento oculto #efc-claro)
   Escala ...... --esc (o modo projetor usa 1.25)
   Selos ....... --ouro-1 ... --ouro-4 --ouro-tinta --ouro-estrela (dourado com reflexo, v2.1.0)

 NOVO NA v2.1.0 (código em 45-v21.js; detalhes em CONTINUACAO-EFCQuiz-v2.1.0.md)
   A01 boneco em camadas (pessoa.av, 9 dígitos) no telão, mapa da turma e perfil. Nunca no PDF.
   Perfil do participante (S.ui.logado): selos X07, revisão X02, mensagens X02 (S.mensagens).
   X01 reforço pendente (sessao.reforco) · X03 voz gravada (item.voz) · X04 sessao.semBloqueio
   X05 aba Setores no Relatório (mínimo de 3 pessoas por setor) · X06 MODELOS prontos.

 NOVO NA v2.0.0 e v2.0.1 (v2.0.1: setor em lista com opção de novo; só confete; detalhes em CONTINUACAO-EFCQuiz-v2.0.1.md)
   Dados no IndexedDB (migra sozinho do localStorage) · código de conferência SHA-256 no PDF
   Cadastro de pessoas com setor · painel Assertividade · meta no treinamento · prompt para IA
   Modo demonstração (Configurações) · sons e comemoração desligados por padrão · app instalável
   API para o EFClaudian: window.EFC_API (versao, aplicarTema, aplicarTextura, removerTextura,
     entrarComConta [I01 desligada], gerarReforco [I03 desligada], canal [I05 local])
   Algarismos: família "EFC Num" (Barlow, só 0-9) na frente de --f-body, para o zero sair aberto.

 TEMAS
   Claro = :root (padrão). Escuro = :root[data-tema="escuro"].
   Os 5 temas do EFClaudian: criar :root[data-tema="nome"]{ ...mesmas variáveis... }
   e definir document.documentElement.dataset.tema = "nome". Nenhuma tela depende de cor fixa.
   Modo projetor = :root[data-projetor="on"] (alto contraste, letra maior, sem textura).

 TEXTURA DE FUNDO (camada fixa <div id="efc-fundo">)
   --textura (padrão none) · --textura-opacidade (0) · --textura-tamanho · --textura-repetir
   --veu (cor translúcida sobre a textura, garante contraste)
   EFC_aplicarTextura({url, opacidade, repetir, escala})  -> liga e põe data-textura="on" no :root
   EFC_removerTextura()                                   -> volta ao padrão
   Regra: pergunta, respostas, tabelas e textos ficam sempre em painéis sólidos (--surface).
   A textura nunca vai para o PDF.

 FONTES embutidas (subconjunto latino, licença SIL OFL 1.1):
   Barlow Semi Condensed (títulos e números grandes), Atkinson Hyperlegible (textos e respostas),
   IBM Plex Mono (chave e números de tabela, tabular-nums).
 Bibliotecas embutidas: qrcodejs 1.0.0 (MIT), jsPDF 2.5.1 (MIT).
=====================================================================
-->
<script>window.EFC_CONFIG = window.EFC_CONFIG || { empresa: "" };</script>

*{box-sizing:border-box;border-radius:0}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;padding:0 0 env(safe-area-inset-bottom,0px);background:transparent;color:var(--fg);font-family:var(--f-body);font-size:calc(15px*var(--esc));line-height:1.45;position:relative;min-height:100vh}
#efc-fundo{position:fixed;inset:0;z-index:0;pointer-events:none}
#efc-fundo::before{content:"";position:absolute;inset:0;background-image:var(--textura);background-size:var(--textura-tamanho);background-repeat:var(--textura-repetir);opacity:var(--textura-opacidade)}
#efc-fundo::after{content:"";position:absolute;inset:0;background:var(--veu);display:none}
:root[data-textura="on"] #efc-fundo::after{display:block}
:root[data-projetor="on"] #efc-fundo{display:none}
.top,main,#fx{position:relative;z-index:1}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:600;margin:0;letter-spacing:.005em;text-wrap:balance}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num,.score,td.r,th.r{font-family:var(--f-body);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
svg{flex:none}
/* faixa do topo: a textura aparece aqui; textos ficam em blocos sólidos */
.top{position:sticky;top:0;z-index:5;border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
:root:not([data-textura="on"]) .top{background:var(--surface)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:7px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;margin-right:auto;background:var(--surface);padding:3px 8px 3px 0}
:root[data-textura="on"] .brand{padding-left:8px;border:1px solid var(--line)}
.brand b{font-family:var(--f-display);font-size:20px;font-weight:700;letter-spacing:.01em}
.brand .sist{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.brand .emp{font-size:13px;color:var(--fg);border-left:1px solid var(--line);padding-left:8px}
.tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--warn);color:var(--warn);padding:1px 6px;font-weight:700}
.tabs{display:flex;border:1px solid var(--line);background:var(--surface)}
.tabs button{background:transparent;border:0;border-right:1px solid var(--line);padding:7px 12px;cursor:pointer;font-weight:700;font-size:13.5px;color:var(--muted)}
.tabs button:last-child{border-right:0}
.tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
main{padding-block:16px 56px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line-forte);background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:700;font-size:14px;min-height:40px;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--fg)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:13px}
.btn.lg{min-height:52px;font-size:16px;padding:12px 20px}
.btn.big{min-height:60px;font-size:18px;padding:14px 24px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg,.ic{width:16px;height:16px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.stack{display:grid;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line)}
.panel>.hd{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.panel>.hd h2{font-size:18px;margin-right:auto}
.panel>.bd{padding:14px}
.solid{background:var(--surface);border:1px solid var(--line);padding:10px 14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.field{display:grid;gap:4px;min-width:0}
.field>span{font-size:12.5px;font-weight:700;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;border:1px solid var(--line-forte);background:var(--surface);padding:8px 10px;min-height:40px}
textarea{min-height:60px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--line-forte);flex-wrap:wrap}
.seg button{border:0;border-right:1px solid var(--line);background:var(--surface);padding:6px 11px;cursor:pointer;font-weight:700;font-size:13px;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:1px 7px;border:1px solid currentColor}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)} .pill.acc{color:var(--accent)} .pill.mut{color:var(--muted)}
.note{border:1px solid var(--line);border-left:3px solid var(--warn);background:var(--surface);padding:8px 12px;font-size:13.5px}
.msg{border:1px solid var(--line);border-left:3px solid var(--bad);background:var(--surface);padding:8px 12px;font-weight:700}
.okmsg{border:1px solid var(--line);border-left:3px solid var(--ok);background:var(--surface);padding:8px 12px;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;white-space:nowrap;font-family:var(--f-body)}
th.sort{cursor:pointer} th.sort:hover{color:var(--fg)}
td.r,th.r{text-align:right}
.tblwrap{overflow-x:auto}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.list>div:last-child{border-bottom:0}
.list .t{flex:1;min-width:180px}
.list .t b{display:block;font-size:15.5px}
.chip{display:inline-block;width:10px;height:10px;flex:none;background:var(--c)}
/* marca de equipe: cor + símbolo */
.eqm{display:inline-grid;place-items:center;width:22px;height:22px;background:var(--c);color:var(--ans-fg);flex:none;vertical-align:middle}
.eqm svg{width:14px;height:14px}
.eqm.g{width:34px;height:34px}.eqm.g svg{width:22px;height:22px}
/* editor */
.item{border:1px solid var(--line);background:var(--surface)}
.item>.ih{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--sunk)}
.item>.ih .n{font-family:var(--f-mono);font-weight:600;font-size:13px;min-width:26px}
.item>.ib{padding:10px;display:grid;gap:10px}
.alt{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center}
.k{font-family:var(--f-display);font-weight:700;width:30px;height:30px;display:grid;place-items:center;background:var(--c);color:var(--ans-fg);flex:none;font-size:18px}
.thumb{max-height:90px;border:1px solid var(--line)}
.thumb.s{max-height:44px}
.banco{border:1px solid var(--accent);background:var(--surface)}
.banco .lista{max-height:340px;overflow:auto;border-top:1px solid var(--line)}
.banco label{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.banco label input{width:18px;height:18px;margin-top:2px;accent-color:var(--accent)}
/* linha do tempo: uma marca quadrada por etapa */
.linha{display:flex;gap:4px;align-items:center;flex-wrap:wrap}
.linha i{width:12px;height:12px;display:block;border:1.5px solid var(--line-forte);background:var(--line-forte)}
.linha i.exp{background:transparent}
.linha i.feito{border-color:var(--fg);background:var(--fg)}
.linha i.feito.exp{background:transparent}
.linha i.atual{border-color:var(--accent);background:var(--accent);outline:2px solid var(--accent);outline-offset:2px}
.linha i.atual.exp{background:transparent;border-width:3px}
.linha .lg{font-size:11px;color:var(--muted);margin-left:8px}
/* telão */
.tel{display:grid;grid-template-rows:auto 1fr auto;gap:10px;min-height:76vh}
.tel .tbar{display:flex;gap:12px;align-items:center;padding:8px 14px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line)}
.tel .tbar .ttl{font-family:var(--f-display);font-size:calc(21px*var(--esc));font-weight:600;margin-right:auto}
.tel .tbar .linha{flex-basis:100%;order:5;padding-top:6px;border-top:1px solid var(--line)}
.tel .tbd{padding:20px 22px;display:grid;align-content:start;gap:18px;background:var(--surface);border:1px solid var(--line)}
.tel .tft{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding:8px 12px;background:var(--surface);border:1px solid var(--line)}
:root[data-textura="on"] .tel{padding:clamp(10px,2.4vw,34px)}
.tel:fullscreen{background:var(--bg);padding:1.5vw;min-height:100vh;overflow:auto}
.chave{font-family:var(--f-mono);font-weight:600;font-size:clamp(44px,9vw,104px);letter-spacing:.08em;line-height:1;border:1px solid var(--line-forte);padding:8px 16px;width:max-content;max-width:100%}
.big{font-family:var(--f-display);font-size:calc(clamp(30px,4.6vw,60px)*var(--esc));font-weight:600;line-height:1.1;margin:0}
.big.q2{font-size:calc(clamp(34px,5.4vw,72px)*var(--esc))}
.mid{font-family:var(--f-display);font-size:calc(clamp(22px,2.8vw,32px)*var(--esc));font-weight:600;margin:0}
.qr{background:var(--qr-claro);padding:10px;width:max-content;max-width:100%;border:1px solid var(--line)}
.qr img,.qr canvas{display:block;width:160px;height:160px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:8px}
.opt{display:flex;gap:14px;align-items:center;background:var(--surface);color:var(--fg);border:1px solid var(--line-forte);border-left:10px solid var(--c);padding:10px 16px 10px 10px;min-height:72px;font-size:calc(clamp(18px,2.3vw,28px)*var(--esc));font-weight:700;text-align:left;width:100%;font-family:var(--f-body)}
.opt .k{width:1.7em;height:1.7em;font-size:1.05em}
button.opt{cursor:pointer}
button.opt:active{background:var(--sunk)}
.opt.foto{flex-direction:column;align-items:stretch;padding:0;border-left-width:1px;gap:0}
.opt.foto .fh{display:flex;align-items:center;gap:10px;padding:6px 8px;background:var(--c);color:var(--ans-fg)}
.opt.foto .fh .k{background:transparent;border:2px solid var(--ans-fg);width:30px;height:30px;font-size:18px}
.opt.foto img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--sunk)}
.opts.fotos{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
/* cronômetro: régua que esvazia, marcas a cada 5 s */
.timer{display:flex;align-items:center;gap:12px}
.timer .s{font-family:var(--f-display);font-weight:700;font-size:calc(clamp(30px,4.4vw,56px)*var(--esc));min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;line-height:1}
.regua{position:relative;flex:1;height:18px;border:1px solid var(--line-forte);background:var(--surface);min-width:80px;overflow:hidden}
.regua>i{position:absolute;inset:0 auto 0 0;background:var(--accent);transition:width .25s linear}
.regua>b{position:absolute;top:0;bottom:0;width:1px;background:var(--surface);opacity:.9}
.regua>b::after{content:"";position:absolute;left:0;bottom:0;height:5px;width:1px;background:var(--line-forte)}
.timer.urg .regua>i{background:var(--warn)}
.timer.urg .s{color:var(--warn)}
/* resultado: barras crescem da esquerda e a certa ganha contorno (único movimento da tela) */
.bars{display:grid;gap:8px}
.bars .b{display:grid;grid-template-columns:minmax(0,1fr) 3.4em;gap:10px;align-items:center}
.bars .bt{position:relative;background:var(--sunk);min-height:calc(46px*var(--esc));display:flex;align-items:center;gap:10px;padding:4px 10px 4px 6px;overflow:hidden;border:1px solid var(--line)}
.bars .bt>i{position:absolute;inset:0 auto 0 0;background:var(--c);opacity:.28;transform-origin:left;animation:cresce .7s cubic-bezier(.2,.7,.2,1) both}
.bars .bt>.k,.bars .bt>span{position:relative}
.bars .bt>span{font-weight:700;font-size:calc(clamp(16px,1.8vw,22px)*var(--esc))}
.bars .bt.fill{outline:3px solid var(--ok);outline-offset:-1px;animation:contorno .3s .7s both}
.bars .score{font-size:calc(22px*var(--esc));text-align:right}
@keyframes cresce{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes contorno{from{outline-color:transparent}to{outline-color:var(--ok)}}
.rank{display:grid;gap:0;border-top:1px solid var(--line)}
.rank>div{display:grid;grid-template-columns:2.6em auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);font-size:calc(17px*var(--esc))}
.rank .p{font-family:var(--f-mono);font-weight:600}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;align-items:end;max-width:720px;width:100%;margin-inline:auto;border-bottom:2px solid var(--fg)}
.podium>div{display:grid;gap:4px;align-content:start;justify-items:center;text-align:center;padding:10px 8px;background:var(--sunk);border:1px solid var(--line);border-bottom:0}
.podium .h1{min-height:210px;background:var(--accent);color:var(--accent-fg)}
.podium .h2{min-height:150px}.podium .h3{min-height:110px}
.podium .pos{font-family:var(--f-display);font-weight:700;font-size:calc(40px*var(--esc));line-height:1}
.podium b{font-size:calc(18px*var(--esc));overflow-wrap:anywhere}
.confete{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confete i{position:absolute;top:-12px;width:7px;height:7px;animation:cai linear forwards}
@keyframes cai{to{transform:translateY(108vh) rotate(360deg)}}
/* participante: uma pergunta por tela, sem rolagem */
.phone{max-width:460px;margin:0 auto;background:var(--surface);border:1px solid var(--line);height:calc(100dvh - 120px);min-height:520px;display:grid;grid-template-rows:auto 1fr auto}
.phone .ph{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:46px}
.phone .ph b{margin-right:auto}
.phone .pb{padding:12px;display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0}
.phone .pf{padding:8px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.phone .q{font-size:21px;font-weight:700;line-height:1.25;margin:0;font-family:var(--f-body)}
.phone .opts1{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.phone .opt{min-height:64px;font-size:19px;padding:8px 12px 8px 8px}
.phone .opts1.fotos{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.phone .opts1.fotos{flex:1;min-height:0;grid-template-rows:1fr 1fr;margin-top:0}
.phone .opt.foto{min-height:0;overflow:hidden;padding:0}
.phone .opt.foto .fh{font-size:17px;padding:4px 6px}
.phone .opt.foto img{flex:1;min-height:0;height:0;aspect-ratio:auto}
.phone .timer .s{font-size:28px}.phone .regua{height:14px}
.phone input[type=text]{min-height:50px;font-size:18px}
:root[data-textura="on"] main .phone{outline:clamp(8px,3vw,20px) solid transparent}
.ord{display:grid;gap:6px}
.ord button{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;min-height:64px;border:1px solid var(--line-forte);background:var(--surface);font-size:17px;font-weight:700;cursor:pointer;width:100%}
.ord button .o{font-family:var(--f-mono);font-weight:600;width:30px;height:30px;display:grid;place-items:center;border:1px solid var(--line-forte);flex:none}
.ord button.on{border-color:var(--accent);background:var(--accent-soft)}
.ord button.on .o{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.fb{padding:16px;display:grid;gap:8px;border:1px solid var(--line);background:var(--surface)}
.fb.ok{border-left:6px solid var(--ok)} .fb.bad{border-left:6px solid var(--bad)} .fb.mut{border-left:6px solid var(--muted)}
.fb .v{font-family:var(--f-display);font-size:30px;font-weight:700}
.fb.ok .v{color:var(--ok)} .fb.bad .v{color:var(--bad)}
.icon{width:22px;height:22px}
.choice{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line-forte);background:var(--surface);cursor:pointer;font-weight:700;min-height:52px}
.choice input{width:20px;height:20px;accent-color:var(--accent)}
.choice.full{opacity:.45;cursor:not-allowed}
/* relatório */
.numeros{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line);background:var(--surface)}
.numeros>div{padding:12px 16px;border-right:1px solid var(--line);display:grid;gap:2px}
.numeros>div:last-child{border-right:0}
.numeros b{font-family:var(--f-display);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));border-top:1px solid var(--line);border-left:1px solid var(--line);background:var(--surface)}
.kv>div{padding:7px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.kv b{display:block;font-weight:700;overflow-wrap:anywhere}
.att{border:1px solid var(--line);background:var(--surface);display:grid;grid-template-rows:auto 1fr auto}
.att .ah{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:baseline}
.att .ah b{font-family:var(--f-display);font-size:17px}
.att .ah .c{margin-left:auto;font-family:var(--f-display);font-weight:700;font-size:26px}
.att.s-bad{border-top:3px solid var(--bad)} .att.s-warn{border-top:3px solid var(--warn)} .att.s-mut{border-top:3px solid var(--muted)}
.att ul{margin:0;padding:8px 12px 8px 28px;display:grid;gap:4px;font-size:14px}
.att .af{padding:8px 12px;border-top:1px solid var(--line)}
.foto{max-width:420px;border:1px solid var(--line)}
.score{font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
/* mapa de calor */
.hm{border-collapse:collapse;font-size:13px}
.hm th,.hm td{border:1px solid var(--line);padding:0;text-align:center}
.hm th.nm,.hm td.nm{text-align:left;padding:4px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis}
.hm th.q a{display:block;padding:4px 6px;color:var(--fg);text-decoration:none;font-family:var(--f-mono);font-weight:600}
.hm th.q a:hover{background:var(--accent-soft)}
.hm td.c{width:34px;height:30px}
.hm td.c svg{width:16px;height:16px;display:block;margin:auto}
.hm td.ok{background:var(--hm-ok);color:var(--hm-fg)} .hm td.bad{background:var(--hm-bad);color:var(--hm-fg)} .hm td.no{background:var(--hm-none);color:var(--hm-none-fg)}
.hm td.r{padding:4px 8px}
.hm tr.tot td{font-family:var(--f-mono);font-size:12px;padding:3px 2px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center}
.leg span{display:inline-flex;gap:6px;align-items:center}
.leg i{display:inline-grid;place-items:center;width:20px;height:20px}
.leg i svg{width:13px;height:13px}
.alvo{outline:3px solid var(--accent);outline-offset:4px}
/* assinatura, modal, foto */
.sig-wrap{background:var(--surface);border:1px solid var(--line);padding:8px;display:grid;gap:8px}
.sig-pad{width:100%;height:170px;border:1px dashed var(--line-forte);touch-action:none;cursor:crosshair;display:block;background:var(--assin-fundo)}
.sig-img{height:36px;max-width:140px;background:var(--assin-fundo);border:1px solid var(--line);padding:2px;vertical-align:middle}
.modal{position:fixed;inset:0;background:var(--modal-fundo);z-index:90;display:grid;place-items:center;padding:16px}
.modal .box{background:var(--surface);color:var(--fg);border:1px solid var(--line-forte);max-width:460px;width:100%;padding:20px;display:grid;gap:14px}
.modal .box h3{font-size:22px}
.fotocard{border:1px solid var(--accent);border-left:6px solid var(--accent);background:var(--surface);padding:16px;display:grid;gap:10px}
.warnbar{position:sticky;top:0;z-index:4}
/* projetor: sem detalhes finos */
:root[data-projetor="on"] .regua>b,:root[data-projetor="on"] .linha .lg{display:none}
:root[data-projetor="on"] .tel .tbd,:root[data-projetor="on"] .tel .tbar{border-width:2px}
:root[data-projetor="on"] .opt{border-width:2px;border-left-width:14px}
:root[data-projetor="on"] .top{display:none}
@media (max-width:640px){
  .tabs{width:100%} .tabs button{flex:1;padding:8px 4px;font-size:12.5px}
  .tel .tbd{padding:14px}
  .numeros{grid-template-columns:1fr 1fr}.numeros>div:nth-child(2){border-right:0}.numeros>div:nth-child(-n+2){border-bottom:1px solid var(--line)}
  .numeros b{font-size:34px}
  .podium .h1{min-height:150px}.podium.prop .h1{min-height:calc(265px*var(--esc,1))}.podium.prop .h2{min-height:calc(235px*var(--esc,1))}.podium.prop .h3{min-height:calc(210px*var(--esc,1))}
  .phone{height:calc(100dvh - 104px);min-height:0}
  main{padding-block:10px 20px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}.confete{display:none}}

:root[data-cheia="on"] .top{display:none}
@media (max-width:600px){.phone{height:calc(100dvh - 146px);min-height:480px}}


/* ===================== v2.0.0 ===================== */
/* V14: toque e foco */
.btn,.opt,.seg button,.tabs button,.ord button,.choice,.ic-btn{transition:transform .06s,filter .06s}
.btn:active,.seg button:active,.tabs button:active,.ord button:active,.choice:active,.ic-btn:active{transform:translateY(1px);filter:brightness(.92)}
button.opt:active{transform:translateY(1px);filter:brightness(.94)}
.btn:focus-visible,.opt:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.skel{display:grid;gap:10px;padding:14px;background:var(--surface);border:1px solid var(--line)}
.skel i{display:block;height:14px;background:var(--sunk);animation:skel 1.2s ease-in-out infinite alternate}
.skel i:nth-child(2){width:78%}.skel i:nth-child(3){width:56%}.skel i:nth-child(4){width:84%}
@keyframes skel{from{opacity:.55}to{opacity:1}}
/* faixa de demonstração (S07) e rodapé de versão (S06) */
.demobar{font-size:12px;letter-spacing:.04em;padding:3px 14px;background:var(--warn-soft);color:var(--fg);border-bottom:1px solid var(--warn);text-align:center;position:relative;z-index:1}
.rodape{position:relative;z-index:1;text-align:center;font-size:12px;color:var(--muted);padding:6px 14px 18px}
.rodape b{font-family:var(--f-display);font-weight:600;color:var(--fg)}
/* botões só ícone (ferramentas do telão) */
.ferr{display:inline-flex;border:1px solid var(--line);margin-left:auto}
.ic-btn{display:inline-grid;place-items:center;width:38px;height:36px;border:0;border-right:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.ic-btn:last-child{border-right:0}
.ic-btn svg{width:18px;height:18px}
.ic-btn[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.ic-btn:hover{color:var(--fg)}
/* menu de 3 pontinhos (V15) */
.mnu{position:relative}
.mnu .pop{position:absolute;right:0;top:calc(100% + 4px);z-index:20;background:var(--surface);border:1px solid var(--line-forte);min-width:190px;display:grid;box-shadow:0 6px 18px var(--sombra)}
.mnu .pop button{display:flex;gap:8px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:10px 12px;cursor:pointer;font-weight:700;font-size:14px}
.mnu .pop button:last-child{border-bottom:0}
.mnu .pop button.bad{color:var(--bad)}
.mnu .pop svg{width:16px;height:16px}
.tlist>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.tlist>div:last-child{border-bottom:0}
.tlist .t b{display:block;font-size:16px}
.tlist .acs{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.tlist .ult{grid-column:1/-1;display:flex;gap:10px;align-items:center;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.passos{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));border:1px solid var(--line);background:var(--surface)}
.passos>div{padding:12px 14px;border-right:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.passos>div:last-child{border-right:0}
.passos .n{font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;color:var(--accent);min-width:1ch}
/* régua de meta (V07, V09) */
.rmeta{position:relative;height:8px;background:var(--sunk);border:1px solid var(--line);margin-top:6px}
.rmeta>i{position:absolute;inset:0 auto 0 0;background:var(--c,var(--accent))}
.rmeta>b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg)}
.rmeta.mini{height:6px;width:64px;display:inline-block;vertical-align:middle;margin:0 0 0 8px}
.rmeta.mini>b{top:-3px;bottom:-3px}
.estado{font-size:13px;font-weight:700}
.estado.ok{color:var(--ok)}.estado.bad{color:var(--bad)}
.numeros.n5{grid-template-columns:repeat(5,minmax(0,1fr))}
/* linha do tempo legível (V06) */
.lt{display:grid;gap:6px}
.lt .segs{display:flex;gap:3px;flex-wrap:wrap}
.lt .sg{position:relative;min-width:30px;height:26px;display:grid;place-items:center;border:1px solid var(--line-forte);font-family:var(--f-display);font-weight:700;font-size:13px;color:var(--muted);background:var(--surface);padding:0 6px;overflow:hidden}
.lt .sg>span{position:relative}
.lt .sg::before{content:"";position:absolute;inset:0;background:var(--fg);transform:scaleX(0);transform-origin:left}
.lt .sg.feito::before{transform:scaleX(1)}
.lt .sg.feito{color:var(--bg);border-color:var(--fg)}
.lt .sg.exp{border-style:dashed}
.lt .sg.atual{color:var(--accent-fg);border-color:var(--accent)}
.lt .sg.atual::before{background:var(--accent);animation:enche .6s cubic-bezier(.2,.7,.2,1) forwards}
@keyframes enche{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.lt .txt{font-size:13px;color:var(--muted)}
.lt .txt b{color:var(--fg)}
.tel .tbar .lt{flex-basis:100%;order:5;padding-top:6px;border-top:1px solid var(--line)}
.tel .tbar .kchave{font-family:var(--f-mono);font-weight:600;font-size:calc(22px*var(--esc));letter-spacing:.06em}
.sala{font-family:var(--f-display);font-weight:700;font-size:calc(22px*var(--esc))}
/* fileira de quem respondeu (V04) */
.quem{display:grid;gap:6px}
.quem .fil{display:flex;gap:4px;flex-wrap:wrap}
.quem .fil i{width:18px;height:18px;border:1.5px solid var(--line-forte);background:transparent;transition:background .2s}
.quem .fil i.on{background:var(--accent);border-color:var(--accent)}
.quem .ct{font-family:var(--f-display);font-weight:700;font-size:calc(26px*var(--esc))}
/* sala de espera (V05) */
.entrar{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.entrar .qr img,.entrar .qr canvas{width:190px;height:190px}
.contsala{display:flex;align-items:baseline;gap:10px}
.contsala b{font-family:var(--f-display);font-weight:700;font-size:calc(64px*var(--esc));line-height:1}
.colunas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.colunas>div{border-top:3px solid var(--c,var(--line-forte));padding-top:6px;display:grid;gap:3px;align-content:start}
.colunas .gh{display:flex;gap:8px;align-items:center;font-weight:700}
.colunas .gh .num{margin-left:auto;color:var(--muted)}
.colunas span.nm{font-size:15px}
/* barras: verde só na certa (V08) */
.bars .bt>i.cert{background:var(--ok);opacity:.34}
.bars .bt>i.err{background:var(--line-forte);opacity:.32}
.bars .score small{display:block;font-size:.62em;color:var(--muted)}
.pctg{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;margin-left:auto}
/* pódio proporcional (V11) */
.podwrap{position:relative;overflow:hidden;max-width:720px;width:100%;margin-inline:auto}
.podium.prop .h1{min-height:calc(265px*var(--esc,1))}.podium.prop .h2{min-height:calc(235px*var(--esc,1))}.podium.prop .h3{min-height:calc(210px*var(--esc,1))}
.podium.prop .h1{background:var(--accent);color:var(--accent-fg)}
.fxpod{position:absolute;inset:0;pointer-events:none;width:100%;height:100%}
.gincl{display:flex;gap:12px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--accent);background:var(--surface);padding:8px 14px;max-width:720px;width:100%;margin-inline:auto;font-size:calc(17px*var(--esc))}
.gincl .lbl{min-width:70px}
/* celular: pergunta e resultado (V02, V03) */
.phone .qtop{display:grid;gap:6px}
.phone .qtop .qn{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;color:var(--muted)}
.phone .q{font-size:23px}
.phone .ouvir{width:100%;min-height:46px;font-size:16px}
.mini-lt{display:flex;gap:3px;flex:1}
.mini-lt i{flex:1;height:6px;background:var(--sunk);border:1px solid var(--line)}

/* mapa agrupado (V09) */

.veredito{border:1px solid var(--line);border-left:6px solid var(--ok);padding:14px;display:grid;gap:4px;background:var(--surface)}

/* prompt para IA (S08) */
.prompt textarea{min-height:240px;font-family:var(--f-mono);font-size:12.5px;line-height:1.5}
/* setores e cadastro (P01) */
.chips{display:flex;flex-wrap:wrap;gap:6px}

.chips button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.achados{display:grid;border:1px solid var(--line)}

.achados button:last-child{border-bottom:0}
.achados button span.st{font-size:13px;color:var(--muted);font-weight:700;white-space:nowrap}
.achados button[aria-pressed="true"]{background:var(--accent-soft);outline:2px solid var(--accent);outline-offset:-2px}
.setl{display:grid;gap:6px}
.setl>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px}
.pess{max-height:320px;overflow:auto;border:1px solid var(--line)}
.pess label{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line)}
.pess select{width:auto;min-height:32px;padding:3px 6px}
.armaz{display:grid;gap:6px}
.armaz .rmeta{height:10px;margin:0}
.integr{display:grid;border:1px solid var(--line)}
.integr>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);align-items:center}
.integr>div:last-child{border-bottom:0}
/* assertividade (M01) */
.filtro{border:1px solid var(--line);background:var(--surface)}
.filtro>button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:transparent;padding:10px 14px;cursor:pointer;font-weight:700;min-height:46px}
.filtro>button .sum{color:var(--muted);font-weight:600;font-size:13.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filtro>.bd{border-top:1px solid var(--line);padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}

.graf .ax{stroke:var(--line);stroke-width:1}
.graf .mt{stroke:var(--fg);stroke-width:1.5;stroke-dasharray:5 4}
.graf .ln{stroke:var(--accent);stroke-width:2;fill:none}
.graf .pt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.graf .hit{fill:transparent;cursor:pointer}
.graf text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.graf text.v{fill:var(--fg);font-weight:700}
.dif{font-weight:700}.dif.f{color:var(--ok)}.dif.m{color:var(--warn)}.dif.d{color:var(--bad)}
.zoomimg{max-width:96vw;max-height:86vh;border:1px solid var(--line-forte);background:var(--surface)}
img[data-act="zoom"]{cursor:zoom-in}
@media (max-width:860px){.numeros.n5{grid-template-columns:1fr 1fr}.numeros.n5>div{border-bottom:1px solid var(--line)}.numeros.n5>div:nth-child(2n){border-right:0}.numeros.n5>div.wide{grid-column:1/-1;border-right:0}}

}

select{max-width:100%}
.bars .b{grid-template-columns:minmax(0,1fr) 5.4em}
.bars .score small{display:inline;margin-left:5px}
.entrar{grid-template-columns:auto minmax(0,auto) minmax(0,1fr)}
.entrar .chave{font-size:calc(clamp(40px,6vw,88px)*var(--esc))}

.quem{margin-left:auto;justify-items:end;gap:4px}
.quem .ct{font-size:calc(22px*var(--esc))}
@media (max-width:640px){.entrar{grid-template-columns:1fr}.entrar .contsala{justify-self:start;align-items:flex-start;text-align:left}.quem{margin-left:0;justify-items:start}}
.demobar b{font-weight:700}
:root[data-demo="on"] .phone{height:calc(100dvh - 146px)}
@media (max-width:600px){:root[data-demo="on"] .phone{height:calc(100dvh - 168px)}}
@media (max-width:860px){.numeros.n5>div:nth-child(1){order:-2}.numeros.n5>div:nth-child(3){order:-1}.numeros.n5>div{border-right:0}.numeros.n5>div:nth-child(1),.numeros.n5>div:nth-child(4){border-right:1px solid var(--line)}}
.field>.seg{justify-self:start}
/* ===================== v2.1.0 ===================== */
:root, .efc-claro{ --ouro-1:#7c5d14; --ouro-2:#b8902f; --ouro-3:#e9cf7a; --ouro-4:#fff3c4; --ouro-tinta:#3a2a05; --ouro-estrela:#f3d77a; }
:root[data-tema="escuro"]{ --ouro-1:#8a6a1c; --ouro-2:#c49b38; --ouro-3:#ecd17e; --ouro-4:#fff6d2; --ouro-tinta:#2b1f03; --ouro-estrela:#f6dc87; }
/* boneco: quadrado, traço reto, sem animação */
.av{display:inline-block;flex:none;vertical-align:middle;border:1px solid var(--line);background:var(--sunk)}
.av.xs{width:22px;height:22px}.av.sm{width:30px;height:30px}.av.pod{width:56px;height:56px;border-color:currentColor}.av.md{width:72px;height:72px}.av.lg{width:104px;height:104px}
.avbox{display:grid;gap:10px}
.avtopo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start}
.avsug{display:flex;gap:6px;flex-wrap:wrap}
.avop{border:1px solid var(--line);background:var(--surface);padding:2px;cursor:pointer;line-height:0}
.avop[aria-pressed="true"]{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.avop .av{border:0}
.avabas{display:flex;flex-wrap:wrap;border:1px solid var(--line-forte)}
.avabas button{flex:1 1 auto;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--surface);padding:6px 8px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer}
.avabas button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.avopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.avopts .av.sm{width:100%;height:auto;aspect-ratio:1}
/* telão: sala de espera com boneco */
.salaav{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:4px 16px}
.salaav .nm,.colunas .nm{display:flex;align-items:center;gap:8px;font-size:16px;min-width:0}
.salaav .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podium .h1 .av.pod{border-color:var(--accent-fg)}
.hm td.nm .av{margin-right:6px;vertical-align:-6px}
/* perfil do participante */
.perfil{display:grid;gap:12px}
.ptopo{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center}
.ptopo>div{display:grid;gap:3px;justify-items:start}
.ptopo .pn{font-size:19px;line-height:1.2;overflow-wrap:anywhere}
.pbl{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.selos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.selo{position:relative;display:grid;justify-items:center;text-align:center;gap:2px;padding:8px 4px;border:1px solid var(--line);font-size:12px;line-height:1.2}
.selo b{font-size:13px}
.selo .sf{width:44px;height:50px;display:grid;place-items:center;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:var(--sunk);color:var(--muted);position:relative;overflow:hidden}
.selo .sf svg{width:22px;height:22px;position:relative;z-index:1}
.selo.tem{border-color:var(--ouro-2)}
.selo.tem .sf{background:linear-gradient(135deg,var(--ouro-1) 0%,var(--ouro-2) 30%,var(--ouro-3) 46%,var(--ouro-4) 52%,var(--ouro-3) 58%,var(--ouro-2) 74%,var(--ouro-1) 100%);color:var(--ouro-tinta)}
.selo.tem .sf::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.55) 48%,transparent 58%)}
.selo:not(.tem){opacity:.72}
.selo .estr{position:absolute;inset:0;pointer-events:none;color:var(--ouro-estrela)}
.selo .estr svg{position:absolute;width:9px;height:9px;filter:drop-shadow(0 0 1px var(--ouro-1))}

.hist{display:grid;border:1px solid var(--line)}
.hist>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:8px 10px;border-bottom:1px solid var(--line);align-items:center}

.dsl .nn{grid-column:2/-1;font-size:12.5px}
.dsl.g>div{font-size:calc(22px*var(--esc));padding:12px 8px}
.dsl.g .bar{height:26px}.dsl.g .pc{font-size:calc(30px*var(--esc))}.dsl.g .nn{font-size:calc(14px*var(--esc))}

@media (max-width:640px){.podium.prop .h1{min-height:calc(265px*var(--esc,1))}.podium.prop .h2{min-height:calc(235px*var(--esc,1))}.podium.prop .h3{min-height:calc(210px*var(--esc,1))}}

.integr>.nvconta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}

.integr>.okmsg,.integr>.msg{display:block;border-left-width:3px}
.nvpill{cursor:pointer;font-family:inherit;font-size:11px;background:transparent;min-height:0;line-height:1.6}
.nvst{min-height:24px}
:root[data-turma="1"] #tabs{display:none}
@media (max-width:640px){.integr>.nvlogin{grid-template-columns:1fr}}

<script>
"use strict";
/* ============ base ============ */
const EFC_CONFIG = Object.assign({empresa: "", produto: "EFCQuiz", sistema: "EFClaudian"}, window.EFC_CONFIG || {});
window.EFC_CONFIG = EFC_CONFIG;
const APP_VERSAO = "2.2.0";
const DAY = 86400000, FOTO_DIAS = 3, LS = "efcquiz-v1";
const METAS = [50,60,70,75,80,90,100];
const SETORES_PADRAO = ["Packing","Campo","Laboratório","Almoxarifado","Oficina","Segurança","RH","ADM","Outros"];
/* integrações com o EFClaudian: preparadas e desligadas (I01, I03, I04, I05) */
EFC_CONFIG.integracoes = Object.assign({contaEFClaudian: false, reforcoNC: false, temasEFClaudian: true, firebase: false}, EFC_CONFIG.integracoes || {});
const PERFIS = {primario:"Primário", estrela:"Líder estrela", colaborador:"Colaborador"};
const TEMPOS = [10,20,30,45,60,90,120];
const CORES = ["var(--ans-a)","var(--ans-b)","var(--ans-c)","var(--ans-d)","var(--ans-e)","var(--ans-f)"];

const NOMES_EQ = ["Equipe Barra","Equipe Cruz","Equipe Triângulo","Equipe Quadrado","Equipe Linha dupla","Equipe Ponto"];
/* símbolo de equipe: só traços retos */
const SIMB_EQ = [
  '<path d="M4 12h16" stroke-width="4"/>',
  '<path d="M12 4v16M4 12h16" stroke-width="3.5"/>',
  '<path d="M12 4L21 19H3Z" stroke-width="2.6" fill="none"/>',
  '<path d="M5 5h14v14H5Z" stroke-width="2.6" fill="none"/>',
  '<path d="M4 9h16M4 15h16" stroke-width="3"/>',
  '<path d="M10 10h4v4h-4Z" stroke-width="4"/>'];
const simbSvg = i => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="square" stroke-linejoin="miter">${SIMB_EQ[(i||0) % SIMB_EQ.length]}</svg>`;
function marcaEq(cor, simb, g){ return `<span class="eqm${g ? " g" : ""}" style="--c:${cor}">${simbSvg(simb)}</span>`; }

/* S08: gerar prompt para qualquer IA converter um POP ou slide no formato do EFCQuiz */
function textoPrompt(o){
  const n = +o.n, g = Math.min(+o.g, n), a = n - g;
  return `Você vai transformar o material anexo (POP, procedimento ou slides) em um treinamento do EFCQuiz.
Responda SOMENTE com um JSON válido, sem nenhum texto antes ou depois, neste formato:

{"formato":"efcquiz/treinamento","titulo":"...","meta":${o.meta},"itens":[
 {"tipo":"explicacao","enunciado":"tema que o instrutor vai explicar no telão"},
 {"tipo":"multipla","enunciado":"...","alternativas":["...","...","...","..."],"correta":1,"tempo":${o.tempo},"uso":"avaliacao","porque":"..."},
 {"tipo":"vf","enunciado":"afirmação para julgar","correta":1,"tempo":20,"uso":"avaliacao","porque":"..."},
 {"tipo":"ordenar","enunciado":"Coloque as etapas na ordem certa.","alternativas":["etapa 1","etapa 2","etapa 3","etapa 4"],"tempo":45,"uso":"avaliacao","porque":"..."}
]}

Regras:
1. Faça ${n} perguntas no total: ${a} de avaliação ("uso":"avaliacao") e ${g} de gincana ("uso":"gincana"). As de gincana vêm no fim.
2. Use só o que está no material. Não invente norma, número, prazo ou produto que não esteja nele.
3. Linguagem simples, para colaboradores de campo e de packing house, muitos com pouca leitura: frases curtas, palavras do dia a dia, sem pegadinha e sem dupla negação.
4. Múltipla escolha ("multipla"): 4 alternativas curtas e uma só certa. "correta" é a posição da certa, contando a partir de 0 (0 = A, 1 = B, 2 = C, 3 = D). Varie a posição da certa entre as perguntas.
5. Verdadeiro ou falso ("vf"): "correta" 0 = Verdadeiro, 1 = Falso. Não precisa de "alternativas".
6. Ordenar etapas ("ordenar"): de 3 a 6 etapas, escritas já na ordem CERTA. O app embaralha para o participante.
7. "porque": uma ou duas frases que explicam a resposta certa, com base no material.
8. "tempo" em segundos. Padrão ${o.tempo}. Valores permitidos: 10, 20, 30, 45, 60, 90, 120. Ordenar usa 45 ou 60.
9. Coloque um item "explicacao" antes de cada assunto novo (de 2 a 4 no total). Ele não é pergunta.
10. "titulo": nome curto do treinamento${o.titulo ? ` (use: ${o.titulo})` : ""}. "meta": ${o.meta}.
11. Não use emoji. Dentro dos textos, use aspas simples em vez de aspas duplas.
12. Misture os tipos: a maioria de múltipla escolha, algumas de verdadeiro ou falso e pelo menos uma de ordenar, se o material tiver uma sequência de passos.

Depois que eu salvar a sua resposta como arquivo .json, vou importar no EFCQuiz e revisar.`;
}

function rotFase(s){
  if (s.status === "espera") return "aguardando início";
  if (s.modo === "ritmo") return "em andamento" + (s.prazo ? " até " + s.prazo.split("-").reverse().join("/") : "");
  const f = s.fase, it = s.itens[f.idx];
  if (f.etapa === "fim") return "perguntas concluídas";
  if (f.etapa === "explicacao") return "explicação";
  return (it && it.ensaio ? "ensaio" : "pergunta " + numQ(s, f.idx)) + (f.etapa === "resultado" ? " (resultado)" : "");
}
function numQ(s, idx){ let n = 0; for (let i = 0; i <= idx; i++) if (scored(s.itens[i])) n++; return n + " de " + s.itens.filter(scored).length; }

function vBanco(d){

    <div class="lista">${lista.map(({T, it}) => { const k = T.id + "|" + it.id; return `<label><input type="checkbox" data-bancosel="${esc(k)}" ${b.sel.includes(k) ? "checked" : ""}><span><b>${esc(it.enunciado || "(sem texto)")}</b><br><span class="muted" style="font-size:13px">${esc(T.titulo)} · ${TIPO_NOME[it.tipo]} · ${it.uso === "gincana" ? "Gincana" : "Avaliação"}</span></span></label>`; }).join("") || `<p class="muted" style="padding:10px 12px;margin:0">${outros.length ? "Nenhuma pergunta encontrada." : "Não há outros treinamentos para copiar."}</p>`}</div>
    <div class="bd muted" style="font-size:13px;border-top:1px solid var(--line)">A cópia é independente: editar aqui não muda o treinamento de origem.</div></section>`;
}
const TIPO_NOME = {explicacao:"Explicação", multipla:"Múltipla escolha", vf:"Verdadeiro ou falso", ordenar:"Ordenar etapas"};

function controles(s, compacto){
  const f = s.fase, b = [];
  if (s.status === "encerrada") return "";
  if (s.status === "espera"){
    if (S.config.demo) b.push(`<button class="btn" data-act="simular" data-arg="${s.id}">Simular participantes</button>`);
    if (s.modo === "aovivo") b.push(`<button class="btn" data-act="toggleEntrada" data-arg="${s.id}">${s.entradaAberta ? "Fechar entrada" : "Reabrir entrada"}</button>`);
    b.push(`<button class="btn pri" data-act="avancar" data-arg="${s.id}" ${s.part.length ? "" : "disabled"}>${s.modo==="aovivo" ? "Iniciar treinamento" : "Liberar respostas"}</button>`);
  } else if (s.modo === "ritmo"){
    if (S.config.demo) b.push(`<button class="btn" data-act="simular" data-arg="${s.id}">Simular participantes</button>`);
    b.push(`<button class="btn" data-act="toggleEntrada" data-arg="${s.id}">${s.entradaAberta ? "Fechar entrada" : "Reabrir entrada"}</button>`);
  } else if (f.etapa === "explicacao") b.push(`<button class="btn pri lg" data-act="avancar" data-arg="${s.id}">Concluir explicação</button>`);
  else if (f.etapa === "pergunta") b.push(s.semBloqueio ? `<button class="btn pri" data-act="avancar" data-arg="${s.id}">Mostrar resultado</button>` : `<button class="btn" data-act="encerrarTempo" data-arg="${s.id}">Encerrar tempo</button>`);
  else if (f.etapa === "resultado") b.push(`<button class="btn pri lg" data-act="avancar" data-arg="${s.id}">Próxima</button>`);
  if (compacto && s.status !== "espera" && s.modo === "aovivo") b.push(`<button class="btn" data-act="toggleEntrada" data-arg="${s.id}">${s.entradaAberta ? "Fechar entrada" : "Reabrir entrada"}</button>`);
  if (compacto && s.status !== "espera") b.push(`<button class="btn bad" data-act="pedeEncerrar" data-arg="${s.id}">${ICON.cam}Encerrar treinamento</button>`);
  return b.join("");
}

  const f = s.fase, it = s.itens[f.idx], pj = !!UI().projetor, som = UI().som === true;
  const bar = `<div class="tbar"><span class="ttl">${esc(s.titulo)}</span><span class="row" style="gap:6px"><span class="lbl">Chave</span><b class="kchave">${s.chave}</b></span><span class="row" style="gap:6px"><b class="sala num">${s.part.length}</b><span class="lbl">${s.equipe === "um" ? "equipes" : "na sala"}</span></span>

function topoPergunta(s, p, it, idx){
  const nq = s.itens.filter(scored).length;
  return `<div class="qtop"><div class="qn">${it.ensaio ? "Pergunta de teste" : `Pergunta ${numQ(s, idx)}`}${it.ensaio ? "" : miniLinha(s, p, false)}</div>${it.ensaio ? `<span class="pill warn" style="justify-self:start">Não vale nota</span>` : it.uso === "gincana" ? `<span class="pill acc" style="justify-self:start">Gincana · vale rapidez</span>` : ""}</div>`;
}
function telaPergunta(s, p, it, inicio, r){
  const idx = s.itens.indexOf(it);
  const fala = it.enunciado + ". " + (it.tipo === "ordenar" ? "Toque nas etapas na ordem certa." : it.alternativas.map((a, k) => "Resposta " + letra(k) + ": " + a).join(". "));
  const ordem = s.embaralhar && it.tipo === "multipla" ? shuffled(it.alternativas.length, p.id + it.id) : it.alternativas.map((_, k) => k);
  let corpo;
  if (r){
    if (it.tipo === "ordenar") corpo = `<div class="ord">${r.ordem.map((k, n) => `<button class="on" disabled><span class="o">${n+1}</span>${esc(it.alternativas[k])}</button>`).join("")}</div><div class="marcou">Ordem enviada. Aguarde o tempo acabar.</div>`;
    else corpo = `<div class="opts1${temFotos(it) ? " fotos" : ""}">${ordem.map(k => optHtml(it, k, "div", `aria-label="Resposta ${letra(k)}"`, k === r.escolha ? " esc" : " apag")).join("")}</div><div class="marcou">Você marcou ${letra(r.escolha)}. Aguarde o tempo acabar.</div>`;
  } else if (it.tipo === "ordenar"){
    const ordD = shuffled(it.alternativas.length, "ord" + it.id), sel = UI().ordSel || [];
    corpo = `<div class="ord">${ordD.map(k => { const pos = sel.indexOf(k); return `<button class="${pos>=0?"on":""}" data-act="ordTap" data-arg="${k}"><span class="o">${pos>=0?pos+1:""}</span>${esc(it.alternativas[k])}</button>`; }).join("")}</div>
      <div class="row"><button class="btn" data-act="ordLimpar">Limpar</button><button class="btn pri lg" style="flex:1" data-act="ordConfirmar" data-arg="${it.id}" ${sel.length===it.alternativas.length?"":"disabled"}>Confirmar ordem</button></div>`;
  } else {
    const pre = s.confirmar && UI().pre && UI().pre.item === it.id ? UI().pre.k : null;
    corpo = `<div class="opts1${temFotos(it) ? " fotos" : ""}">${ordem.map(k => optHtml(it, k, "button", `data-act="${s.confirmar ? "preEscolher" : "responder"}" data-arg="${it.id}|${k}" aria-label="Resposta ${letra(k)}"`, pre === null ? "" : k === pre ? " esc" : " apag")).join("")}</div>
      ${pre !== null ? `<button class="btn pri enviar" data-act="responder" data-arg="${it.id}|${pre}">Enviar resposta ${letra(pre)}</button>` : s.confirmar ? `<p class="muted" style="margin:0;font-size:14px">Toque na alternativa e depois em Enviar.</p>` : ""}`;
  }
  return `${topoPergunta(s, p, it, idx)}
    ${regua(inicio + it.tempo*1000, it.tempo*1000, s.semBloqueio)}
    <p class="q">${esc(it.enunciado)}</p>${r ? "" : it.voz ? `<button class="btn ouvir" data-act="vozOuvir" data-arg="${it.id}" aria-label="Ouvir a pergunta">${ICON.som}Ouvir a pergunta</button>` : botOuvir(fala, true)}${fotoPerg(it, "max-height:22vh;object-fit:contain;align-self:flex-start")}${corpo}`;
}
function meusAcertos(s, p){ const lib = liberados(s); let ac = 0, n = 0; s.itens.forEach((it, i) => { if (!scored(it) || !lib.has(i)) return; if (s.modo === "ritmo" && !s.resp[p.id + "|" + it.id] && i >= (S.eu ? S.eu.idx : 0)) return; n++; if (isCorrect(it, s.resp[p.id + "|" + it.id])) ac++; }); return {ac, n}; }
function feedback(it, r, s, ritmo, p){
  const ok = isCorrect(it, r);
  const cls = !r ? "mut" : ok ? "ok" : "bad", v = !r ? "Sem resposta" : ok ? "Certo" : "Incorreto";
  const marcou = !r ? "O tempo acabou antes da resposta." : it.tipo === "ordenar" ? "Você enviou a ordem." : "Você marcou " + letra(r.escolha) + ".";
  const certa = it.tipo === "ordenar" ? it.alternativas.map((a, k) => (k+1) + ". " + esc(a)).join("<br>") : `<b>${letra(it.correta)}</b> · ${esc(it.alternativas[it.correta] || "foto " + letra(it.correta))}`;
  const m = p ? meusAcertos(s, p) : null;
  return `<div class="res ${cls}">
    <div class="faixa">${!r ? ICON.traco : ok ? ICON.ok : ICON.x}<span><span class="v">${v}</span><span class="s2">${marcou}</span></span></div>
    <div class="bl cert"><span class="lbl">Resposta certa</span><span>${certa}</span></div>
    ${it.porque ? `<div class="bl"><span class="lbl">Por quê</span><span>${esc(it.porque)}</span></div>` : ""}
    ${it.uso === "gincana" && !it.ensaio ? `<div class="bl"><span class="lbl">Gincana</span><b class="score">${pontos(it, r)} pontos</b>${r && r.tarde ? `<span class="muted" style="font-size:14px">Resposta depois do tempo: vale para a nota, sem pontos de rapidez.</span>` : ""}</div>` : r && r.tarde ? `<div class="bl"><span class="muted" style="font-size:14px">Resposta depois do tempo: vale para a nota normalmente.</span></div>` : ""}
    ${m && !it.ensaio && m.n ? `<div class="meus"><span class="lbl">Seus acertos até agora · <span class="num">${m.ac} de ${m.n}</span></span>${miniLinha(s, p, true)}</div>` : ""}
  </div>
  ${ritmo ? `<button class="btn pri lg" data-act="ritmoProx">Continuar</button>` : `<p class="muted" style="margin:0">Aguarde a próxima pergunta.</p>`}`;
}
function meuResultado(s, p){
  const c = calc(s), r = c.rows.find(x => x.p.id === p.id); if (!r) return "";
  const eq = c.eqPosRemota ? c.eqPosRemota - 1 : c.equipes.findIndex(e => e.nome === nomeEquipe(s, p));
  return `<span class="lbl">Seu resultado</span>
    <div class="kv" style="grid-template-columns:1fr 1fr"><div><span class="lbl">Acertos</span><b class="score" style="font-size:24px">${r.ac}</b></div><div><span class="lbl">Erros</span><b class="score" style="font-size:24px">${r.er}</b></div>
    <div><span class="lbl">Sem resposta</span><b class="score" style="font-size:24px">${r.sr}</b></div><div><span class="lbl">Nota</span><b class="score" style="font-size:24px">${r.nota}%</b></div></div>
    ${c.ginc.length ? `<div class="solid"><b>Gincana:</b> <span class="num">${r.pg}</span> pontos</div>` : ""}
    ${s.mostrarRanking ? `<p class="q">${s.equipe !== "nao" && eq >= 0 ? "Sua equipe ficou em " + (eq+1) + "º lugar." : "Você ficou em " + r.pos + "º lugar."}</p>` : ""}
    ${blocoAssinatura(s, p)}
    <p class="muted">Participação registrada. Obrigado.</p>`;
}
function assKeys(s, p){ return s.equipe === "um" ? p.membros.map((m, k) => ({key: p.id + "#" + k, nome: m})) : [{key: p.id, nome: p.nome}]; }
function blocoAssinatura(s, p){
  s.assin = s.assin || {};
  const ks = assKeys(s, p), falta = ks.find(x => !s.assin[x.key]);
  const feitas = ks.filter(x => s.assin[x.key]).map(x => `<div class="row" style="gap:8px"><img class="sig-img" src="${s.assin[x.key]}" alt="Assinatura de ${esc(x.nome)}"><span>${esc(x.nome)}</span></div>`).join("");
  if (!falta) return `<span class="lbl">Assinatura${ks.length > 1 ? "s" : ""} registrada${ks.length > 1 ? "s" : ""}</span>${feitas}`;
  return `<div class="stack" style="gap:8px"><span class="lbl">Assinatura de presença ${ks.length > 1 ? `(${ks.indexOf(falta)+1} de ${ks.length})` : ""}</span>
    <p style="margin:0;font-weight:600">${esc(falta.nome)}, assine com o dedo no quadro:</p>
    <div class="sig-wrap"><canvas id="sigCanvas" class="sig-pad" aria-label="Quadro de assinatura"></canvas>
    <div class="row"><button class="btn" data-act="sigLimpar">Limpar</button><button class="btn pri lg" style="flex:1" data-act="sigSalvar" data-arg="${falta.key}">${ICON.pen}Confirmar assinatura</button></div></div>
    ${feitas}</div>`;
}
function vRitmo(s, p){
  if (s.status === "encerrada") return meuResultado(s, p);
  if (s.status === "espera") return `<p class="q">Inscrição registrada.</p><p class="muted">Aguarde o responsável liberar as respostas.</p>`;
  const e = S.eu;
  if (e.idx >= s.itens.length) return meuResultado(s, p);
  const it = s.itens[e.idx];
  if (!isQ(it)) return `<span class="lbl">Explicação</span><p class="q">${esc(it.enunciado)}</p>${it.texto ? `<p>${esc(it.texto)}</p>` : ""}${botOuvir(it.enunciado + ". " + (it.texto||""), true)}<button class="btn pri lg" data-act="ritmoProx">Continuar</button>`;
  if (e.fb) return feedback(it, s.resp[p.id + "|" + it.id], s, true, p);
  if (!e.qStart){ e.qStart = now(); }
  return telaPergunta(s, p, it, e.qStart, null);
}

  if (aba === "assert") return `<div class="stack"><div class="row solid"><h1 style="font-size:22px;margin-right:auto">Assertividade</h1>${abas}</div>${vAssert()}</div>`;

  const linhas = [...lp].sort((a, b) => { const va = a[sk.k], vb = b[sk.k]; return (typeof va === "string" ? va.localeCompare(vb, "pt") : va - vb) * sk.d; });
  const th = (k, l) => `<th class="sort" data-act="sort" data-arg="${k}">${l}${sk.k===k ? (sk.d>0 ? ICON.up : ICON.dn).replace("<svg", '<svg class="ic" style="vertical-align:-3px;width:12px;height:12px"') : ""}</th>`;
  const N = numerosSessao(s, c), dif = N.media - M;

  const dsp = l => l.empate ? `<span class="dsp" title="Empatou em acertos e foi desempatado pelo menor tempo">*</span>` : "";
  const foto = s.foto;

  o.itens.forEach(x => { if (!x || typeof x !== "object") return; const tipo = ["explicacao","multipla","vf","ordenar"].includes(x.tipo) ? x.tipo : (Array.isArray(x.alternativas) ? "multipla" : "explicacao");
    if (tipo === "explicacao"){ if (txt(x.enunciado)) itens.push({id: uid(), tipo, enunciado: txt(x.enunciado), texto: txt(x.texto)}); return; }
    const it = itemNovo(tipo); it.enunciado = txt(x.enunciado); it.porque = txt(x.porque); it.uso = x.uso === "gincana" ? "gincana" : "avaliacao"; it.tempo = perto(+x.tempo || (tipo === "ordenar" ? 45 : 30), TEMPOS);

}

    const k = Math.min(1, max / Math.max(img.width, img.height)); const cv = document.createElement("canvas"); cv.width = Math.round(img.width*k); cv.height = Math.round(img.height*k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); ok(cv.toDataURL("image/jpeg", 0.72)); }; img.src = fr.result; }; fr.readAsDataURL(file); });
}

function EFC_aplicarTextura(o = {}){

  document.documentElement.setAttribute("data-textura", "on");

function EFC_removerTextura(){

/* textura de teste: ruído leve + linhas de plantio, cores tiradas das variáveis */
function texturaAmostra(){
  const cv = document.createElement("canvas"); cv.width = 220; cv.height = 220; const x = cv.getContext("2d");
  const fg = cssVar("--fg"), ac = cssVar("--accent");
  x.globalAlpha = .18; x.fillStyle = fg; for (let i = 0; i < 1600; i++){ x.fillRect(Math.random()*220, Math.random()*220, 1, 1); }
  x.globalAlpha = .35; x.strokeStyle = ac; x.lineWidth = 2; for (let k = -220; k < 440; k += 22){ x.beginPath(); x.moveTo(k, 220); x.lineTo(k + 110, 0); x.stroke(); }
  x.globalAlpha = .25; x.fillStyle = ac; for (let k = -220; k < 440; k += 22) for (let t = 0; t < 1; t += .1){ x.fillRect(k + 110*t - 1.5, 220 - 220*t - 1.5, 3, 3); }
  return cv.toDataURL("image/png");
}

function tick(){
  if (tickBusy) return; tickBusy = true;

    let m = expirarFotos();
    S.sessoes.forEach(s => { if (tickSessao(s)) m = true; });
    const e = S.eu, s = minhaSessao();
    if (e && s && s.modo === "ritmo" && s.status === "andamento" && e.qStart && !e.fb && e.idx < s.itens.length){
      const it = s.itens[e.idx]; if (isQ(it) && !s.semBloqueio && now() - e.qStart >= it.tempo*1000){ e.fb = true; m = true; } }
    if (m) save();
    const ae = document.activeElement, cvs = document.getElementById("sigCanvas"), editando = (ae && app.contains(ae) && /INPUT|TEXTAREA|SELECT/.test(ae.tagName)) || (cvs && cvs.dataset.sujo) || !!UI().conf && false;

  } finally { tickBusy = false; }
}

/* ---------- X01: reforço pendente com um toque ---------- */
function reforcoPendente(){
  const grupos = new Map();
  S.treinamentos.forEach(T => {
    const ult = new Map();
    S.sessoes.filter(s => s.status === "encerrada" && s.tId === T.id && s.equipe !== "um").sort((a, b) => a.encerradaEm - b.encerradaEm).forEach(s => {
      const c = calc(s); if (!c.aval.length) return;
      c.rows.forEach(r => { if (!r.p.pessoaId) return; ult.set(r.p.pessoaId, {s, r, meta: c.meta}); });
    });
    const pend = [...ult.entries()].filter(([, v]) => v.r.nota < v.meta);
    if (!pend.length) return;
    const qs = new Set(); pend.forEach(([, v]) => v.s.itens.forEach(it => { if (scored(it) && it.uso === "avaliacao" && !isCorrect(it, v.s.resp[v.r.p.id + "|" + it.id])) qs.add(it.id); }));
    const itens = T.itens.filter(it => qs.has(it.id));
    if (!itens.length) return;
    grupos.set(T.id, {T, pessoas: pend.map(([pid, v]) => ({pid, nota: v.r.nota, meta: v.meta, em: v.s.encerradaEm})), itens});
  });
  return [...grupos.values()];
}
function vReforco(){
  if (!pode()) return ""; const gs = reforcoPendente(); if (!gs.length) return "";
  return `<section class="panel">${hdr("Reforço pendente", `<span class="muted" style="font-size:13px">Quem ficou abaixo da meta na última vez, com as perguntas que errou</span>`)}<div class="tlist">${gs.map(g => `<div>

}

/* ---------- X05: desafio entre setores, placar do mês sem nomes ---------- */
const MESES = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const MIN_SETOR = 3;
function dadosSetores(ano, mes){
  const ini = new Date(ano, mes === null ? 0 : mes, 1).getTime(), fim = mes === null ? new Date(ano + 1, 0, 1).getTime() : new Date(ano, mes + 1, 1).getTime(), m = new Map();
  S.sessoes.filter(s => s.status === "encerrada" && s.equipe !== "um" && s.encerradaEm >= ini && s.encerradaEm < fim).forEach(s => {
    const c = calc(s);
    c.rows.forEach(r => { const st = r.p.setor || "Sem setor"; if (!m.has(st)) m.set(st, {setor: st, pess: new Set(), n: 0, ac: 0, sess: new Set()});
      const g = m.get(st); g.pess.add(r.p.pessoaId || r.p.nome); g.sess.add(s.id); g.n += c.aval.length; g.ac += r.ac; });
  });
  const todos = [...m.values()].map(g => ({...g, pct: g.n ? Math.round(g.ac / g.n * 100) : 0}));
  return {placar: todos.filter(g => g.pess.size >= MIN_SETOR && g.n).sort((a, b) => b.pct - a.pct || b.n - a.n), poucos: todos.filter(g => g.pess.size < MIN_SETOR)};
}

/* ---------- X03: voz gravada na pergunta (opcional) ---------- */
let grav = null;
async function gravarVoz(i){
  if (grav){ pararVoz(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder){ UI().erro = "Este aparelho não grava áudio pelo navegador."; save(); render(); return; }
  try {
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    const tipo = ["audio/webm;codecs=opus", "audio/webm", "audio/mp4", "audio/ogg"].find(t => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) || "";
    const rec = new MediaRecorder(st, tipo ? {mimeType: tipo, audioBitsPerSecond: 24000} : {audioBitsPerSecond: 24000}); const partes = [];
    rec.ondataavailable = e => { if (e.data && e.data.size) partes.push(e.data); };
    rec.onstop = () => { st.getTracks().forEach(t => t.stop()); const b = new Blob(partes, {type: rec.mimeType || "audio/webm"}); const fr = new FileReader();
      fr.onload = () => { const it = UI().draft && UI().draft.itens[i]; if (it){ it.voz = fr.result; it.vozSeg = Math.round((now() - grav.t0) / 1000); } grav = null; UI().gravando = null; save(); render(); }; fr.readAsDataURL(b); };
    grav = {rec, i, t0: now(), corte: setTimeout(() => pararVoz(), 60000)}; UI().gravando = i; rec.start(); save(); render();
  } catch(e) { grav = null; UI().gravando = null; UI().erro = "Sem permissão para usar o microfone. Libere o microfone para este site e tente de novo."; save(); render(); }
}

  if (ent.includes("@")) cands = [ent.toLowerCase()];

function nvErroTexto(e){
  const c = e && (e.code || e.message) || "";
  if (/invalid-credential|wrong-password|user-not-found|invalid-login|invalid-email/.test(c)) return "Login ou senha não conferem.";
  if (/sem-perfil/.test(c)) return "Esta conta não tem cadastro ativo no EFClaudian.";
  if (/network|sem internet|unavailable/.test(c)) return "Sem internet. Tente de novo quando a conexão voltar.";
  if (/admin-restricted|operation-not-allowed/.test(c)) return "O login da turma ainda não foi ligado no Firebase. Fale com o responsável.";
  if (/too-many/.test(c)) return "Muitas tentativas. Espere alguns minutos.";
  if (/permission/.test(c)) return "A nuvem recusou o acesso. Confira se as regras do EFCQuiz foram publicadas no Firebase.";
  return "Não foi possível falar com a nuvem (" + c + ").";
}

  const st = s.nuvem.estado === "ok" ? `<span class="pill ok">Na nuvem</span><span class="muted"><span class="num">${n}</span> celular(es) conectado(s)</span>`
    : s.nuvem.estado === "enviando" ? `<span class="pill mut">Enviando para a nuvem...</span>` : `<span class="pill bad">Não foi para a nuvem</span><span class="muted">${esc(s.nuvem.erro || "")}</span><button class="btn sm" data-act="nvRepublicar" data-arg="${s.id}">Tentar de novo</button>`;
  return `<div class="row nvst" style="gap:8px">${st}${s.nuvem.aviso && s.nuvem.estado === "ok" ? `<span class="muted">${esc(s.nuvem.aviso)}</span>` : ""}</div>`;
}

/* ---------------- ciclo: liga a nuvem sozinha quando há internet ---------------- */
const _render = render;
render = function(){ _render(); try { const s = S && S.ui.view === "par" ? minhaSessao() : null; document.documentElement.dataset.turma = s && s.remota ? "1" : ""; } catch(e) {} };
const _tickSessao = tickSessao;
tickSessao = function(s){ return s.remota ? false : _tickSessao(s); };
const _tick = tick;
tick = function(){ try { nvSincronizar(); } catch(e) {} return _tick(); };
window.addEventListener("online", () => { if (NV.estado !== "pronto") nvIniciar().catch(() => {}); render(); });
window.addEventListener("offline", () => render());
/* link do QR leva a chave: .../efcquiz/#entrar=123456 */
function nvChaveDoLink(){ const m = /#entrar=(\d{6})/.exec(location.hash); return m ? m[1] : ""; }
EFC_API.canal = {tipo: "firebase", estado: () => NV.estado, conta: () => NV.conta ? {...NV.conta} : null};
const _iniciarApp = iniciarApp;
iniciarApp = async function(){
  await _iniciarApp();
  const k = nvChaveDoLink();
  if (k){ S.ui.view = "par"; S.eu = S.eu && minhaSessao() && minhaSessao().chave === k ? S.eu : null; if (!S.eu){ UI().join = {etapa: 1, chave: k, busca: "", pessoaId: "", cad: false, nome: "", sobrenome: "", setor: "", equipeId: "", novaEquipe: "", membros: ["",""]}; } save(); render(); }
  /* a nuvem só é chamada quando há o que fazer: conta de responsável, sessão remota ou link com chave */
  const precisa = /^https?:$/.test(location.protocol) && (k || S.ui.nuvemConta || S.sessoes.some(s => (s.nuvem && s.status !== "encerrada") || (s.remota && s.status !== "encerrada")) || (S.mensagens || []).some(m => m.nuvem && !m.resposta));
  if (precisa) nvIniciar().then(() => { nvReligar(); if (k && S.ui.view === "par" && UI().join && !S.eu){ A.joinChave(); save(); render(); } }).catch(() => render());
};
iniciarApp();
</script>

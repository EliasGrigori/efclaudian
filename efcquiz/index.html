<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>EFCquiz mudou de endereço</title>
<style>
body{margin:0;font:15px/1.5 Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:#eeeef3;color:#1a1a26;display:grid;place-items:start center;min-height:100vh}
main{max-width:460px;padding:12vh 20px 0;display:grid;gap:10px}
h1{font-size:20px;margin:0}
a{color:#7c3aed;font-weight:600;word-break:break-all}
p{margin:0}
</style>
</head>
<body>
<main>
<h1>O EFCquiz mudou de endereço</h1>
<p>Abrindo o endereço novo. Se não abrir sozinho, toque aqui:</p>
<p><a id="a" href="https://eliasgrigori.github.io/EFCquiz/">https://eliasgrigori.github.io/EFCquiz/</a></p>
</main>
<script>
/* Endereço antigo (/efclaudian/efcquiz/): só leva para o novo, mantendo o link do QR (#entrar=...) e tira o que o app antigo guardou para abrir sem internet. */
(function () {
  var NOVO = "https://eliasgrigori.github.io/EFCquiz/";
  try {
    if (navigator.serviceWorker) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf("/efclaudian/efcquiz/") >= 0) r.unregister(); }); });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (/^efcquiz-v(0|1|2\.[0-2])[.\d]*$/.test(k)) caches.delete(k); }); });
  } catch (e) {}
  var dest = NOVO + (location.search || "") + (location.hash || "");
  document.getElementById("a").href = dest;
  setTimeout(function () { location.replace(dest); }, 500);
})();
</script>
</body>
</html>
